<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator app - UI/UX</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,Arial,sans-serif;background:#FAFAFB;padding:40px;color:#1B2230}
h1{font-size:26px;font-weight:500;margin-bottom:32px}
.board{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
h2{font-size:16px;font-weight:400;color:#444;margin-bottom:14px}
.phone{width:360px;height:760px;border-radius:32px;overflow:hidden;position:relative}
.light{background:#EEF0F4;border:2px solid #C9CED8;--num:#FFFFFF;--numt:#1B2230;--fn:#DDE3EE;--fnt:#2B3A5A;--op:#CFE3E3;--opt:#0B5555;--eq:#0E6B6B;--eqt:#FFFFFF;--sub:#5B6577;--txt:#1B2230}
.dark{background:#12161C;border:2px solid #2A313D;--num:#1E242D;--numt:#E8ECF3;--fn:#2A3342;--fnt:#C5D0E6;--op:#16403F;--opt:#9ADBD6;--eq:#3FB6AC;--eqt:#07201F;--sub:#8A94A6;--txt:#E8ECF3}
.bar{display:flex;justify-content:space-between;align-items:center;padding:28px 24px 0;font-size:14px;color:var(--sub)}
.icons{font-size:18px;letter-spacing:10px}
.display{height:280px;padding:0 24px 24px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end}
.expr{font-size:18px;color:var(--sub);margin-bottom:6px}
.result{font-size:56px;font-weight:500;color:var(--txt);line-height:1.1}
.pad{position:absolute;left:17px;top:340px;display:grid;grid-template-columns:repeat(4,74px);grid-auto-rows:74px;gap:10px}
.key{border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px}
.num{background:var(--num);color:var(--numt)}.fn{background:var(--fn);color:var(--fnt)}
.op{background:var(--op);color:var(--opt);font-weight:500}.eq{background:var(--eq);color:var(--eqt);font-weight:500}
.splash{background:#0E6B6B;border:2px solid #0B5555;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.logo{width:120px;height:120px;border-radius:32px;background:#FFFFFF;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px}
.logo div{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:500;background:#CFE3E3;color:#0B5555}
.logo .e{background:#0E6B6B;color:#fff}
.sname{font-size:32px;font-weight:500;margin-top:28px}
.stag{font-size:15px;color:#CFE3E3;margin-top:8px}
.sver{position:absolute;bottom:36px;font-size:13px;color:#9ADBD6}
</style></head><body>
<h1>Calculator app: UI/UX design</h1>
<div class="board">
<section class="frame-wrap"><h2>Splash screen</h2>
<div class="phone splash"><div class="logo"><div>+</div><div>−</div><div>×</div><div class="e">=</div></div>
<div class="sname">Calculator</div><div class="stag">Quick math, clean result</div><div class="sver">Version 1.0</div></div></section>
<section class="frame-wrap"><h2>Main screen, light</h2>
<div class="phone light">
<div class="bar"><span>Calculator</span><span class="icons">&#9719; &#8942;</span></div>
<div class="display"><div class="expr">1,250 × 12</div><div class="result">15,000</div></div>
<div class="pad"><div class="key fn">AC</div><div class="key fn">⌫</div><div class="key fn">%</div><div class="key op">÷</div><div class="key num">7</div><div class="key num">8</div><div class="key num">9</div><div class="key op">×</div><div class="key num">4</div><div class="key num">5</div><div class="key num">6</div><div class="key op">−</div><div class="key num">1</div><div class="key num">2</div><div class="key num">3</div><div class="key op">+</div><div class="key num">±</div><div class="key num">0</div><div class="key num">.</div><div class="key eq">=</div></div></div></section>
<section class="frame-wrap"><h2>Main screen, dark</h2>
<div class="phone dark">
<div class="bar"><span>Calculator</span><span class="icons">&#9719; &#8942;</span></div>
<div class="display"><div class="expr">1,250 × 12</div><div class="result">15,000</div></div>
<div class="pad"><div class="key fn">AC</div><div class="key fn">⌫</div><div class="key fn">%</div><div class="key op">÷</div><div class="key num">7</div><div class="key num">8</div><div class="key num">9</div><div class="key op">×</div><div class="key num">4</div><div class="key num">5</div><div class="key num">6</div><div class="key op">−</div><div class="key num">1</div><div class="key num">2</div><div class="key num">3</div><div class="key op">+</div><div class="key num">±</div><div class="key num">0</div><div class="key num">.</div><div class="key eq">=</div></div></div></section>
</div></body></html>
